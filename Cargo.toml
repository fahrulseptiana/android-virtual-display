[workspace]
resolver = "2"
members = ["crates/vd-core", "crates/vd-host", "crates/vd-client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/fahrul/vd"

[workspace.dependencies]
vd-core = { path = "crates/vd-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# Pairing / control-channel crypto (pure Rust, Android-friendly).
x25519-dalek = "2"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
getrandom = "0.3"

eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }
winit = { version = "0.30", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
